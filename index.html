<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle Imob</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral de navegação + área de trabalho; período no topo; painel em grade de cartões e gráficos */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#e9ede8; --line:#d6ddd5;
  --fg:#15201a; --muted:#5b6a61; --accent:#1d6a4d; --accent-soft:#dcebe3; --accent-ink:#ffffff;
  --gold:#9c7020; --gold-soft:#f3e8d2; --blue:#3a68ad;
  --good:#23794a; --good-soft:#dcefe3; --warn:#a86300; --warn-soft:#f7ead6; --bad:#b0352b; --bad-soft:#f6dfdc;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 4px 14px rgba(20,32,26,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1411; --surface:#151d19; --surface-2:#1c2621; --line:#2a3630;
  --fg:#e5ebe7; --muted:#93a299; --accent:#52b689; --accent-soft:#1d3329; --accent-ink:#06140d;
  --gold:#d8a952; --gold-soft:#33291a; --blue:#7ea8e8;
  --good:#5cc28b; --good-soft:#18301f; --warn:#e6a640; --warn-soft:#352813; --bad:#ee7065; --bad-soft:#3a1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .foot{margin-top:auto;color:var(--muted);font-size:12px;padding:8px 10px;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.me b{color:var(--fg);font-size:13px;display:block}

main{min-width:0;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
.top h1{font-size:26px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.mnav{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.mnav button{border:0;background:transparent;width:32px;height:34px;cursor:pointer;color:var(--muted);font-size:16px}
.mnav button:hover{color:var(--fg)}
.mnav span{min-width:128px;text-align:center;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h2{font-size:16px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card .hd small{color:var(--muted)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

.kpi{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.lb{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi.gold .v{color:var(--gold)}
.kpi.good .v{color:var(--good)}
.kpi.bad .v{color:var(--bad)}

.meta{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;padding:20px 22px}
.meta .big{font-family:var(--f-display);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-top:8px}
.meta .of{color:var(--muted);font-size:14px;margin-top:6px}
.bar{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative;margin-top:14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.bar.thin{height:8px;margin-top:8px}
.meta .facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;align-content:center}
.fact .v{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.fact .s{font-size:12px;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.chart{position:relative;height:260px}
.chart.tall{height:300px}
.empty-chart{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:13px;border:1px dashed var(--line);border-radius:8px}

.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.t2{color:var(--muted);font-size:12px}
td.act{white-space:nowrap;text-align:right}
td select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.part{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--surface-2);font-weight:700;font-size:12px}
.rank.r1{background:var(--gold-soft);color:var(--gold)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

.cor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cor{cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.cor:hover{border-color:var(--accent)}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.av.sm{width:30px;height:30px;font-size:12px}
.cor .who b{display:block;font-size:15px}
.cor .who small{color:var(--muted)}
.cor .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.cor .stats div{display:flex;flex-direction:column}
.cor .stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.cor .stats strong{font-variant-numeric:tabular-nums;font-size:15px}
.cor.off{opacity:.6}

.hbar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hbar .tr{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--blue);border-radius:99px}
.hbar .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;min-width:36px}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.split i{display:block;height:100%}

.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty h3{color:var(--fg);font-size:17px;margin-bottom:6px}
.empty p{max-width:46ch;margin:0 auto 14px}
.note{border-radius:10px;padding:10px 14px;font-size:13px;background:var(--warn-soft);color:var(--warn)}

.overlay{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:50}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.sheet.wide{max-width:820px}
.sheet h2{font-size:19px;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:400;font-size:14px;color:var(--fg);width:100%}
.form textarea{min-height:70px;resize:vertical}
.hint{font-weight:400;font-size:12px}
.preview{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13px}
.preview .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.preview .row b{font-variant-numeric:tabular-nums}
.preview .row.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:700}
.sheet .foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.sheet .foot .r{display:flex;gap:8px;margin-left:auto}
.radio{display:flex;gap:8px}
.radio label{flex:1;flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;color:var(--fg);font-weight:500}
.radio input{width:auto}

/* telas de acesso */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(900px 500px at 15% -10%,var(--accent-soft),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 26px;box-shadow:var(--shadow)}
.auth-card .brand{padding:0 0 22px}
.auth-card h1{font-size:22px;margin-bottom:4px}
.auth-card p.lead{color:var(--muted);margin:0 0 18px}
.auth-card .form{grid-template-columns:1fr}
.auth-card .btn.pri{width:100%;padding:11px}
.auth-alt{margin-top:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.msg{border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--good-soft);color:var(--good)}
.setup ol{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:6px}
code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:12.5px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);z-index:20;gap:2px}
  .brand,.nav .foot .metaTxt{display:none}
  .nav .foot{margin:0 0 0 auto;padding:0}
  .me{border:0;padding:0}
  .me .av,.me div{display:none}
  .nav a{white-space:nowrap;padding:8px 10px}
  .nav a svg{display:none}
  .meta{grid-template-columns:minmax(0,1fr)}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .g4,.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .kpi .v{font-size:19px}
  .meta .big{font-size:28px}
  .form{grid-template-columns:minmax(0,1fr)}
  .top h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ===== telas de acesso ===== -->
<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="brand"><div class="mark">CI</div><div><b class="brandName">Controle Imob</b><small style="color:var(--muted)">Financeiro e vendas</small></div></div>
    <div id="authBody"></div>
  </div>
</div>

<!-- ===== sistema ===== -->
<div class="app" id="appRoot" hidden>
  <nav class="nav" id="nav" aria-label="Seções"></nav>
  <main>
    <div class="wrap">
      <div class="top">
        <div><h1 id="title">Painel</h1><div class="sub" id="subtitle"></div></div>
        <div class="period" id="period">
          <div class="seg" role="group" aria-label="Escopo">
            <button type="button" data-esc="mes" id="escMes">Mês</button>
            <button type="button" data-esc="ano" id="escAno">Ano</button>
          </div>
          <div class="mnav"><button type="button" id="prev" aria-label="Período anterior">‹</button><span id="perLabel"></span><button type="button" id="next" aria-label="Próximo período">›</button></div>
          <span id="topAction"></span>
        </div>
      </div>
      <div id="note" hidden></div>
      <div id="view"></div>
    </div>
  </main>
</div>
<div class="overlay" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";
/* ---------- constantes ---------- */
const DEFAULT_CFG={nomeImob:"Controle Imob",meta:8000000,superMeta:12000000,periodoMeta:"anual",pctCorretor:3,pctImob:2.5,pctBonus:0.2,pctAgenc:0.3,
  origens:["Instagram","Facebook / Meta Ads","Google","Portais (ZAP, VivaReal, OLX)","Site","Indicação","Placa","WhatsApp","Plantão","Carteira própria","Outros"]};
const CAT_ENT=["Comissão de venda","Administração de aluguel","Outras entradas"];
const CAT_SAI=["Repasse a corretor","Pagamento do caixa de bônus","Marketing e anúncios","Aluguel e condomínio","Salários e pró-labore","Impostos","Sistemas e portais","Outras saídas"];
const MESES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MESES_L=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const COLS={corretores:"cor",vendas:"ven",agenciamentos:"ag",leads:"lead",lancamentos:"lanc"};
const ICONS={
  painel:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  vendas:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  corretores:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.3.2 3.9 1.8 4.5 4.5"/>',
  leads:'<path d="M4 4h16l-6 8v6l-4 2v-8z"/>',
  agenciamentos:'<path d="M4 21V5a2 2 0 0 1 2-2h8l6 6v12z"/><path d="M14 3v6h6"/><path d="M8 14h8M8 17h5"/>',
  caixa:'<rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19"/><path d="M16 15h2"/>',
  usuarios:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'};
const VIEWS_G={painel:"Painel",vendas:"Vendas",corretores:"Corretores",leads:"Leads",agenciamentos:"Agenciamentos",caixa:"Entradas e saídas",usuarios:"Usuários",ajustes:"Ajustes"};
const VIEWS_C={painel:"Meu painel",vendas:"Minhas vendas",leads:"Meus leads",agenciamentos:"Meus agenciamentos"};

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brl0=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const brlS=n=>{n=+n||0;const a=Math.abs(n);if(a>=1e6)return"R$ "+(n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+" mi";if(a>=1e4)return"R$ "+(n/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0})+" mil";return brl0(n)};
const pctF=(x,d=1)=>((+x||0)*100).toLocaleString("pt-BR",{maximumFractionDigits:d})+"%";
const numF=n=>(+n||0).toLocaleString("pt-BR");
const fmtD=d=>d?String(d).slice(0,10).split("-").reverse().join("/"):"";
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseMoney(s){if(typeof s==="number")return s;s=String(s||"").replace(/[R$\s]/g,"");if(!s)return 0;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s))s=s.replace(/\./g,"");
  const n=parseFloat(s);return isFinite(n)?n:0}
const moneyIn=n=>n?(+n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"";
const ini=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const camelK=k=>k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
const snakeK=k=>k.replace(/[A-Z]/g,c=>"_"+c.toLowerCase());
const camel=o=>{if(!o)return o;const r={};for(const k in o)r[camelK(k)]=o[k];return r};
const snake=o=>{const r={};for(const k in o)if(k!=="id"&&o[k]!==undefined)r[snakeK(k)]=o[k];return r};

const S={sb:null,session:null,me:null,cor:[],ven:[],ag:[],lead:[],lanc:[],users:[],cfg:{...DEFAULT_CFG},equipe:null,
  mes:(store("ci_mes")||todayStr().slice(0,7)),escopo:(store("ci_esc")||"mes"),view:"painel",charts:[],

const sortedCor=()=>[...S.cor].sort((a,b)=>(a.ativo===false)-(b.ativo===false)||a.nome.localeCompare(b.nome));

/* ---------- cálculos ---------- */
function derive(){S.recMap={};S.repMap={};
  for(const l of S.lanc){if(l.vendaId&&l.tipo==="entrada")S.recMap[l.vendaId]=(S.recMap[l.vendaId]||0)+(+l.valor||0);
    if(l.tipo==="saida"&&l.categoria==="Repasse a corretor"&&l.vendaId){const k=l.vendaId+"|"+(l.corretorId||"");S.repMap[k]=(S.repMap[k]||0)+(+l.valor||0)}}}
function pctsOf(v){const c=v.pct||S.cfg;return{cor:+c.pctCorretor||0,imob:+c.pctImob||0,bonus:+c.pctBonus||0,ag:+c.pctAgenc||0}}
function com(v){const p=pctsOf(v),x=+v.valor||0,hasAg=!!v.agenciadorId;
  const cor=x*p.cor/100,bonus=x*p.bonus/100,agRaw=x*p.ag/100,imobBase=x*p.imob/100;
  const total=cor+bonus+agRaw+imobBase,rec=S.recMap[v.id]||0,r=total>0?Math.min(1,rec/total):0;
  return{total,cor,imob:imobBase+(hasAg?0:agRaw),bonus,ag:hasAg?agRaw:0,rec,pend:Math.max(0,total-rec),r,pctTotal:p.cor+p.imob+p.bonus+p.ag}}
function statusV(v){const c=com(v);if(c.total<=0)return["mute","Sem comissão"];if(c.rec<=0.005)return["no","A receber"];if(c.pend>0.005)return["part","Parcial"];return["ok","Recebida"]}
const sumQ=arr=>arr.reduce((s,l)=>s+(+l.quantidade||1),0);
function statsCor(id,f=inPer){
  const vs=S.ven.filter(v=>v.corretorId===id&&f(v.data)),va=S.ven.filter(v=>v.agenciadorId===id&&f(v.data));
  let vgv=0,cv=0,rv=0,ca=0,ra=0;
  vs.forEach(v=>{const c=com(v);vgv+=+v.valor||0;cv+=c.cor;rv+=c.cor*c.r});
  va.forEach(v=>{const c=com(v);ca+=c.ag;ra+=c.ag*c.r});
  const leads=S.lead.filter(l=>l.corretorId===id&&f(l.data)),origens={};
  leads.forEach(l=>{const o=l.origem||"Outros";origens[o]=(origens[o]||0)+(+l.quantidade||1)});
  const nLeads=sumQ(leads),rep=S.lanc.filter(l=>l.tipo==="saida"&&l.categoria==="Repasse a corretor"&&l.corretorId===id&&f(l.data)).reduce((s,l)=>s+(+l.valor||0),0);
  return{vendas:vs,vendasAg:va,nVendas:vs.length,vgv,comVenda:cv,comAg:ca,comis:cv+ca,rec:rv+ra,pend:cv+ca-rv-ra,
    ags:S.ag.filter(a=>a.corretorId===id&&f(a.data)).length,nLeads,origens,conv:nLeads?vs.length/nLeads:null,rep}}
function totals(f=inPer){
  const vs=S.ven.filter(v=>f(v.data));let vgv=0;const t={total:0,cor:0,imob:0,bonus:0,ag:0,rec:0,pend:0};
  vs.forEach(v=>{vgv+=+v.valor||0;const c=com(v);for(const k in t)t[k]+=c[k]});
  const lc=S.lanc.filter(l=>f(l.data)),ent=lc.filter(l=>l.tipo==="entrada").reduce((s,l)=>s+(+l.valor||0),0),
    sai=lc.filter(l=>l.tipo==="saida").reduce((s,l)=>s+(+l.valor||0),0);
  const leads=S.lead.filter(l=>f(l.data));
  return{vendas:vs,nVendas:vs.length,vgv,...t,ent,sai,saldo:ent-sai,nLeads:sumQ(leads),leads,nAgs:S.ag.filter(a=>f(a.data)).length}}
function bonusInfo(){let gerado=0,previsto=0;S.ven.forEach(v=>{const c=com(v);previsto+=c.bonus;gerado+=c.bonus*c.r});
  const pago=S.lanc.filter(l=>l.tipo==="saida"&&l.categoria==="Pagamento do caixa de bônus").reduce((s,l)=>s+(+l.valor||0),0);
  return{gerado,previsto,pago,saldo:gerado-pago}}
function equipeMeses(){const y=+S.mes.slice(0,4);
  if(S.equipe&&S.equipe.ano===y&&S.equipe.meses.length)return Array.from({length:12},(_,i)=>{const r=S.equipe.meses.find(x=>+x.mes===i+1)||{};return{vgv:+r.vgv||0,vendas:+r.vendas||0}});
  return Array.from({length:12},(_,i)=>{const k=y+"-"+String(i+1).padStart(2,"0");const vs=S.ven.filter(v=>(v.data||"").startsWith(k));return{vgv:vs.reduce((s,v)=>s+(+v.valor||0),0),vendas:vs.length}})}
function metaInfo(){const y=S.mes.slice(0,4),m=+S.mes.slice(5,7),em=equipeMeses();
  const mensalCfg=S.cfg.periodoMeta==="mensal";
  const anual=mensalCfg?(+S.cfg.meta||0)*12:+S.cfg.meta||0,superAnual=mensalCfg?(+S.cfg.superMeta||0)*12:+S.cfg.superMeta||0;
  const vgvAno=em.reduce((s,x)=>s+x.vgv,0),vgvMes=em[m-1].vgv,vgvAteMes=em.slice(0,m).reduce((s,x)=>s+x.vgv,0);
  const falta=Math.max(0,anual-vgvAteMes),depois=12-m;
  return{y,m,em,anual,mensal:anual/12,superAnual,superMensal:superAnual/12,vgvAno,vgvMes,vgvAteMes,ritmo:anual/12*m,
    falta,depois,porMes:depois>0?falta/depois:falta,vendasAno:em.reduce((s,x)=>s+x.vendas,0)}}

/* ---------- Supabase: dados ---------- */
async function fetchAll(t){let out=[],from=0;
  for(;;){const{data,error}=await S.sb.from(t).select("*").range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}
  return out.map(camel)}
async function loadTable(t){try{S[COLS[t]]=await fetchAll(t)}catch(e){showNote("Não foi possível carregar "+t+": "+e.message)}}
async function loadConfig(){const{data,error}=await S.sb.from("config").select("dados").eq("id",1).maybeSingle();
  if(!error&&data)S.cfg={...DEFAULT_CFG,...data.dados};if(!Array.isArray(S.cfg.origens)||!S.cfg.origens.length)S.cfg.origens=DEFAULT_CFG.origens}
async function loadEquipe(){const y=+S.mes.slice(0,4);const{data,error}=await S.sb.rpc("resumo_equipe",{ano:y});if(!error)S.equipe={ano:y,meses:data||[]}}
async function loadUsers(){if(!isG())return;try{S.users=await fetchAll("profiles")}catch(e){}}
async function loadAll(){await Promise.all([...Object.keys(COLS).map(loadTable),loadConfig(),loadEquipe(),loadUsers()])}
const pend=new Set();let pendT;
function queueReload(t){pend.add(t);clearTimeout(pendT);pendT=setTimeout(async()=>{const ts=[...pend];pend.clear();
  const jobs=[];for(const x of ts){if(COLS[x])jobs.push(loadTable(x));if(x==="config")jobs.push(loadConfig());if(x==="profiles")jobs.push(refreshMe())}
  if(ts.some(x=>["vendas","leads","agenciamentos"].includes(x)))jobs.push(loadEquipe());
  await Promise.all(jobs);render()},250)}
async function refreshMe(){const{data}=await S.sb.from("profiles").select("*").eq("id",S.session.user.id).maybeSingle();
  if(!data){await S.sb.auth.signOut();return}const me=camel(data);const mudou=!S.me||me.papel!==S.me.papel||me.aprovado!==S.me.aprovado||me.corretorId!==S.me.corretorId;
  S.me=me;if(!me.aprovado||(me.papel==="corretor"&&!me.corretorId)){showWaiting();return}
  if(mudou){await loadAll()}await loadUsers()}
let channel=null;
function subscribe(){if(channel)return;channel=S.sb.channel("imob-"+Math.random().toString(36).slice(2))
  .on("postgres_changes",{event:"*",schema:"public"},p=>queueReload(p.table)).subscribe()}
function errMsg(e){const m=(e&&(e.message||e.details))||"";
  if(/row-level security|permission|42501/i.test(m+(e&&e.code)))return"Você não tem permissão para essa alteração.";
  if(/foreign key|23503/i.test(m+(e&&e.code)))return"Esse registro está ligado a outros dados e não pode ser removido.";
  return"Não foi possível salvar: "+(m||"erro desconhecido")}
async function saveDoc(table,id,data){const body=snake(data);
  const q=id?S.sb.from(table).update(body).eq("id",id):S.sb.from(table).insert(body);
  const{error}=await q;if(error){toast(errMsg(error));return false}queueReload(table);return true}
async function delDoc(table,id){const{error}=await S.sb.from(table).delete().eq("id",id);if(error){toast(errMsg(error));return false}queueReload(table);if(table==="vendas")queueReload("lancamentos");return true}

/* ---------- autenticação ---------- */
function authScreen(html){$("#appRoot").hidden=true;$("#auth").hidden=false;closeModal();$("#authBody").innerHTML=html;
  document.querySelectorAll(".brandName").forEach(e=>e.textContent=S.cfg.nomeImob||"Controle Imob");
  const f=$("#authBody input");if(f)f.focus()}
const msgBox=(t,ok)=>`<div class="msg ${ok?"ok":"err"}">${esc(t)}</div>`;
function authErr(e){const m=(e&&e.message)||"";
  if(/invalid login/i.test(m))return"E-mail ou senha incorretos.";
  if(/email not confirmed/i.test(m))return"Confirme seu e-mail antes de entrar. Procure a mensagem na sua caixa de entrada.";
  if(/already registered/i.test(m))return"Esse e-mail já tem conta. Use “Entrar”.";
  if(/password should be/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  if(/rate limit/i.test(m))return"Muitas tentativas seguidas. Aguarde um minuto e tente de novo.";
  return m||"Algo deu errado. Tente de novo."}
function showSetup(){authScreen(`<div class="setup"><h1>Falta conectar o banco</h1><p class="lead">Este sistema usa o Supabase para login e dados. Para ligar:</p>
  <ol><li>No Supabase, rode o arquivo <code>supabase/schema.sql</code> no SQL Editor.</li><li>Abra <code>config.js</code> e cole a <b>Project URL</b> e a chave <b>anon public</b> (Project Settings › API).</li><li>Publique de novo e recarregue esta página.</li></ol>
  <p class="t2" style="margin-top:14px">O passo a passo completo está no arquivo LEIA-ME.md.</p></div>`)}
function showLogin(msg,ok){authScreen(`<h1>Entrar</h1><p class="lead">Use seu e-mail e senha.</p>${msg?msgBox(msg,ok):""}
  <form class="form" id="fLogin"><label>E-mail<input type="email" id="lEmail" autocomplete="username" required></label>
  <label>Senha<input type="password" id="lPass" autocomplete="current-password" required></label><button class="btn pri" type="submit">Entrar</button></form>
  <div class="auth-alt"><button class="link" data-auth="forgot">Esqueci a senha</button><span>Novo na equipe? <button class="link" data-auth="signup">Criar conta</button></span></div>`);
  $("#fLogin").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="Entrando…";
    const email=$("#lEmail").value.trim();
    const{data,error}=await S.sb.auth.signInWithPassword({email,password:$("#lPass").value});
    if(error){showLogin(authErr(error));$("#lEmail").value=email;$("#lPass").focus();return}await enter(data.session)}}
function showSignup(msg){authScreen(`<h1>Criar conta</h1><p class="lead">Depois de criar, o gestor libera seu acesso.</p>${msg?msgBox(msg):""}
  <form class="form" id="fSign"><label>Seu nome<input id="sNome" autocomplete="name" required></label><label>E-mail<input type="email" id="sEmail" autocomplete="username" required></label>
  <label>Senha <span class="hint">mínimo de 6 caracteres</span><input type="password" id="sPass" autocomplete="new-password" minlength="6" required></label><button class="btn pri" type="submit">Criar conta</button></form>
  <div class="auth-alt"><span>Já tem conta? <button class="link" data-auth="login">Entrar</button></span></div>`);
  $("#fSign").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="Criando…";
    const{data,error}=await S.sb.auth.signUp({email:$("#sEmail").value.trim(),password:$("#sPass").value,
      options:{data:{nome:$("#sNome").value.trim()},emailRedirectTo:location.origin+location.pathname}});
    if(error){showSignup(authErr(error));return}
    if(data.session)await enter(data.session);else showLogin("Conta criada. Abra o e-mail de confirmação que enviamos e depois entre aqui.",true)}}
function showForgot(msg,ok){authScreen(`<h1>Recuperar senha</h1><p class="lead">Enviamos um link para você criar uma senha nova.</p>${msg?msgBox(msg,ok):""}
  <form class="form" id="fForgot"><label>E-mail<input type="email" id="fEmail" required></label><button class="btn pri" type="submit">Enviar link</button></form>
  <div class="auth-alt"><button class="link" data-auth="login">Voltar para o login</button></div>`);
  $("#fForgot").onsubmit=async e=>{e.preventDefault();const{error}=await S.sb.auth.resetPasswordForEmail($("#fEmail").value.trim(),{redirectTo:location.origin+location.pathname});
    if(error)showForgot(authErr(error));else showForgot("Se esse e-mail tiver conta, o link chega em instantes. Confira também o spam.",true)}}
function showNovaSenha(msg){authScreen(`<h1>Nova senha</h1><p class="lead">Escolha a senha que vai usar daqui para frente.</p>${msg?msgBox(msg):""}
  <form class="form" id="fNova"><label>Nova senha<input type="password" id="nPass" autocomplete="new-password" minlength="6" required></label>
  <label>Repita a senha<input type="password" id="nPass2" autocomplete="new-password" minlength="6" required></label><button class="btn pri" type="submit">Salvar senha</button></form>`);
  $("#fNova").onsubmit=async e=>{e.preventDefault();if($("#nPass").value!==$("#nPass2").value){showNovaSenha("As duas senhas não são iguais.");return}
    const{error}=await S.sb.auth.updateUser({password:$("#nPass").value});if(error){showNovaSenha(authErr(error));return}
    S.recovery=false;history.replaceState(null,"",location.pathname);const{data}=await S.sb.auth.getSession();if(data.session)await enter(data.session);else showLogin("Senha alterada. Entre com a nova senha.",true)}}
function showWaiting(){const nome=(S.me&&S.me.nome)||"";
  const txt=S.me&&S.me.aprovado&&S.me.papel==="corretor"&&!S.me.corretorId?"Seu acesso foi liberado, mas ainda falta o gestor ligar sua conta ao seu cadastro de corretor.":"Sua conta foi criada e está aguardando o gestor liberar o acesso.";
  authScreen(`<h1>Olá${nome?", "+esc(nome):""}</h1><p class="lead">${txt}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-auth="recheck">Verificar de novo</button><button class="btn" data-auth="logout">Sair</button></div>`)}
async function enter(session){S.session=session;
  const{data,error}=await S.sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  if(error||!data){authScreen(`<h1>Perfil não encontrado</h1><p class="lead">Confira se o arquivo schema.sql foi rodado no Supabase antes de criar a conta.</p><button class="btn" data-auth="logout">Sair</button>`);return}
  S.me=camel(data);
  if(!S.me.aprovado||(S.me.papel==="corretor"&&!S.me.corretorId)){showWaiting();return}
  await loadAll();subscribe();S.ready=true;
  $("#auth").hidden=true;$("#appRoot").hidden=false;render()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-auth]");if(!b)return;e.preventDefault();const a=b.dataset.auth;
  if(a==="login")showLogin();if(a==="signup")showSignup();if(a==="forgot")showForgot();
  if(a==="logout"){S.ready=false;if(channel){S.sb.removeChannel(channel);channel=null}await S.sb.auth.signOut();S.me=null;showLogin()}
  if(a==="recheck"){const{data}=await S.sb.auth.getSession();if(data.session)await enter(data.session);else showLogin()}});

let tt;function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3600)}

async function shift(d){const y0=S.mes.slice(0,4);let y=+y0,m=+S.mes.slice(5,7);if(S.escopo==="ano")y+=d;else{m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}}

/* ---------- gráficos ---------- */
function mkChart(id,cfg){const el=document.getElementById(id);if(!el||!window.Chart)return;
  Chart.defaults.font.family="Inter, system-ui, sans-serif";Chart.defaults.color=css("--muted");Chart.defaults.borderColor=css("--line");
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,animation:{duration:400},plugins:{legend:{display:false}}},cfg.options||{});
  S.charts.push(new Chart(el,cfg))}
const moneyTick=v=>brlS(v);
const tipMoney={callbacks:{label:c=>(c.dataset.label?c.dataset.label+": ":"")+brl(c.parsed.y??c.parsed.x)}};
const chartBox=(id,cls="chart",emptyMsg)=>emptyMsg?`<div class="${cls}"><div class="empty-chart">${emptyMsg}</div></div>`:`<div class="${cls}"><canvas id="${id}"></canvas></div>`;
const scY=(money)=>({y:{beginAtZero:true,ticks:money?{callback:moneyTick}:{precision:0},grid:{color:css("--line")}},x:{grid:{display:false}}});
const scX=(money)=>({x:{beginAtZero:true,ticks:money?{callback:moneyTick}:{precision:0},grid:{color:css("--line")}},y:{grid:{display:false}}});
function chartVgvMensal(mi){const acc=css("--accent"),fg=css("--fg");
  mkChart("chVgv",{type:"bar",data:{labels:MESES,datasets:[
    {type:"line",label:"Meta mensal",data:Array(12).fill(mi.mensal),borderColor:fg,borderDash:[5,4],borderWidth:1.5,pointRadius:0,order:0},
    ...(mi.superMensal?[{type:"line",label:"Super meta mensal",data:Array(12).fill(mi.superMensal),borderColor:css("--gold"),borderDash:[2,3],borderWidth:2,pointRadius:0,order:0}]:[]),
    {label:"VGV",data:mi.em.map(p=>p.vgv),backgroundColor:mi.em.map((p,i)=>i+1===mi.m?acc:acc+"99"),borderRadius:5,order:1}]},
    options:{scales:scY(true),plugins:{legend:{display:false},tooltip:tipMoney}}})}

/* ---------- blocos comuns ---------- */
function kpi(lb,v,d,cls=""){return`<div class="card kpi ${cls}"><span class="lb">${lb}</span><span class="v">${v}</span><span class="d">${d}</span></div>`}
function emptyBox(t,p,a,l){return`<div class="empty"><h3>${t}</h3><p>${p}</p>${a?`<button class="btn pri" data-a="${a}">${l}</button>`:""}</div>`}
function metaCard(mi){
  const mensalMain=S.cfg.periodoMeta==="mensal";
  const pAno=mi.anual?mi.vgvAno/mi.anual:0,pMes=mi.mensal?mi.vgvMes/mi.mensal:0,ritmoP=mi.anual?mi.ritmo/mi.anual:0;
  const big=mensalMain?mi.vgvMes:mi.vgvAno,bigMeta=mensalMain?mi.mensal:mi.anual,bigP=mensalMain?pMes:pAno;
  const sb=big,sm=mensalMain?mi.superMensal:mi.superAnual,sp=sm?sb/sm:0;
  return`<div class="card meta"><div>
      <span class="lb">${mensalMain?"Meta do mês · "+MESES_L[mi.m-1]:"Meta da equipe · "+mi.y}</span>
      <div class="big">${brl0(big)}</div>
      <div class="of">de ${brl0(bigMeta)} · <b style="color:var(--fg)">${pctF(bigP)}</b> da meta em VGV</div>
      <div class="bar"><i style="width:${Math.min(100,bigP*100)}%"></i>${mensalMain?"":`<span class="tick" style="left:${Math.min(100,ritmoP*100)}%"></span>`}</div>
      ${mensalMain?"":`<div class="legend"><span><i style="background:var(--fg);opacity:.55;width:2px"></i>Onde a equipe deveria estar até ${MESES_L[mi.m-1]}: ${brlS(mi.ritmo)}</span></div>`}
      ${sm?`<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="lb" style="color:var(--gold)">Super meta · ${brl0(sm)}</span><span class="num"><b>${pctF(sp)}</b> <span style="color:var(--muted)">· faltam ${brlS(Math.max(0,sm-sb))}</span></span></div>
        <div class="bar thin"><i style="width:${Math.min(100,sp*100)}%;background:var(--gold)"></i></div></div>`:""}
    </div>
    <div class="facts">
      <div class="fact"><div class="lb">VGV em ${MESES[mi.m-1]}</div><div class="v">${brlS(mi.vgvMes)}</div><div class="bar thin"><i style="width:${Math.min(100,pMes*100)}%"></i></div><div class="s">${pctF(pMes)} de ${brlS(mi.mensal)} no mês</div></div>
      <div class="fact"><div class="lb">${mensalMain?"VGV no ano":"Falta para a meta"}</div><div class="v">${mensalMain?brlS(mi.vgvAno):brlS(Math.max(0,mi.anual-mi.vgvAno))}</div></div>
      <div class="fact"><div class="lb">${mi.depois>0?"Necessário por mês":"Falta em Dezembro"}</div><div class="v">${mi.falta>0?brlS(mi.porMes):"Meta batida"}</div><div class="s">${mi.falta>0?(mi.depois>0?"nos "+mi.depois+" meses seguintes":"para fechar o ano"):"agora é a super meta"}</div></div>
      <div class="fact"><div class="lb">Vendas da equipe no ano</div><div class="v">${mi.vendasAno}</div></div>
    </div></div>`}
const hbars=(arr,color,fmt=x=>x)=>{const mx=arr[0]?arr[0][1]:1;return arr.map(o=>`<div class="hbar"><span>${esc(o[0])}</span><div class="tr"><i style="width:${mx?o[1]/mx*100:0}%;${color?"background:"+color:""}"></i></div><span class="c">${fmt(o[1])}</span></div>`).join("")};

async function saveUser(uid,aprovar){const tr=document.querySelector(`tr[data-uid="${uid}"]`);const u=S.users.find(x=>x.id===uid);if(!tr||!u)return;
  const papel=tr.querySelector('[data-f="papel"]').value;let corretorId=tr.querySelector('[data-f="corretor"]').value||null;
  if(papel==="corretor"&&!corretorId){toast("Escolha o cadastro de corretor dessa pessoa (ou crie um).");return}
  if(corretorId==="__novo"){const{data,error}=await S.sb.from("corretores").insert({nome:u.nome||u.email}).select().single();if(error){toast(errMsg(error));return}corretorId=data.id;queueReload("corretores")}
  const body={papel,corretor_id:corretorId};if(aprovar!==undefined)body.aprovado=aprovar;if(uid===S.me.id){delete body.papel;delete body.aprovado}
  const{error}=await S.sb.from("profiles").update(body).eq("id",uid);if(error){toast(errMsg(error));return}
  toast(aprovar===true?"Acesso liberado":aprovar===false?"Acesso bloqueado":"Usuário atualizado");queueReload("profiles")}

  return l.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.nome)}${c.ativo===false?" (inativo)":""}</option>`).join("")};

      pct:v.pct||{pctCorretor:+S.cfg.pctCorretor,pctImob:+S.cfg.pctImob,pctBonus:+S.cfg.pctBonus,pctAgenc:+S.cfg.pctAgenc}})},id?"Venda atualizada":"Venda lançada")}

function openReceber(id){const v=S.ven.find(x=>x.id===id);if(!v)return;const c=com(v);
  openModal(`<h2>Receber comissão</h2><p style="margin:-6px 0 14px;color:var(--muted)">${esc(v.imovel||"Venda")} · ${brl0(v.valor)} · comissão ${brl(c.total)}, já recebido ${brl(c.rec)}</p>
  <form class="form" id="f"><label>Data do recebimento<input type="date" id="fData" required value="${todayStr()}"></label>
  <label>Valor recebido (R$)<input id="fValor" inputmode="decimal" required value="${moneyIn(c.pend)}"></label>
  <label class="full">Descrição<input id="fDesc" value="Comissão – ${esc(v.imovel||"venda")}"></label></form>
  <p class="t2" style="margin:10px 0 0">Entra no caixa como “Comissão de venda”. Pode receber em parcelas: lance cada uma quando cair.</p>${footBtns()}`);
  bindSubmit(async()=>{const valor=parseMoney($("#fValor").value);if(valor<=0){toast("Informe o valor recebido.");return false}
    return saveDoc("lancamentos",null,{tipo:"entrada",categoria:"Comissão de venda",data:$("#fData").value,valor,descricao:$("#fDesc").value.trim(),vendaId:id,corretorId:null})},"Recebimento lançado")}

function openRepasse(id){const v=S.ven.find(x=>x.id===id);if(!v)return;const c=com(v);
  const parts=[[v.corretorId,c.cor,"venda"]];if(v.agenciadorId)parts.push([v.agenciadorId,c.ag,"agenciamento"]);
  const rows=parts.map(p=>({id:p[0],devido:p[1]*c.r,total:p[1],pago:S.repMap[id+"|"+p[0]]||0,tipo:p[2]}));
  openModal(`<h2>Repassar ao corretor</h2><p style="margin:-6px 0 14px;color:var(--muted)">${esc(v.imovel||"Venda")} · a imob já recebeu ${pctF(c.r)} da comissão</p>
  <div class="preview" style="margin-bottom:12px">${rows.map(r=>`<div class="row"><span>${esc(corNome(r.id))} (${r.tipo})</span><b>${brl(r.pago)} repassado de ${brl(r.total)}</b></div>`).join("")}</div>
  <form class="form" id="f"><label>Corretor<select id="fCor">${rows.map(r=>`<option value="${r.id}">${esc(corNome(r.id))} · ${r.tipo}</option>`).join("")}</select></label>
  <label>Data<input type="date" id="fData" value="${todayStr()}"></label>
  <label class="full">Valor do repasse (R$)<input id="fValor" inputmode="decimal" value="${moneyIn(Math.max(0,rows[0].devido-rows[0].pago))}"></label></form>
  <p class="t2" style="margin:10px 0 0">Sai do caixa como “Repasse a corretor”. O valor sugerido é a parte dele sobre o que já foi recebido.</p>${footBtns()}`);
  $("#fCor").onchange=e=>{const r=rows.find(x=>x.id===e.target.value);$("#fValor").value=moneyIn(Math.max(0,r.devido-r.pago))};
  bindSubmit(async()=>{const valor=parseMoney($("#fValor").value);if(valor<=0){toast("Informe o valor do repasse.");return false}const cid=$("#fCor").value;
    return saveDoc("lancamentos",null,{tipo:"saida",categoria:"Repasse a corretor",data:$("#fData").value,valor,descricao:"Repasse "+corNome(cid)+" – "+(v.imovel||"venda"),vendaId:id,corretorId:cid})},"Repasse lançado")}

function openLanc(id){const l=id?S.lanc.find(x=>x.id===id):{tipo:"entrada",data:defDate()};
  const catOpts=t=>(t==="entrada"?CAT_ENT:CAT_SAI).map(c=>`<option ${c===l.categoria?"selected":""}>${c}</option>`).join("");
  openModal(`<h2>${id?"Editar lançamento":"Novo lançamento"}</h2><form class="form" id="f">
  <div class="full radio"><label><input type="radio" name="tipo" value="entrada" ${l.tipo==="entrada"?"checked":""}> Entrada</label><label><input type="radio" name="tipo" value="saida" ${l.tipo==="saida"?"checked":""}> Saída</label></div>
  <label>Data<input type="date" id="fData" required value="${esc(l.data||"")}"></label><label>Valor (R$)<input id="fValor" inputmode="decimal" required value="${moneyIn(l.valor)}"></label>
  <label>Categoria<select id="fCat">${catOpts(l.tipo)}</select></label>
  <label>Corretor (opcional)<select id="fCor"><option value="">—</option>${corOpts(l.corretorId,true)}</select></label>
  <label class="full">Descrição<input id="fDesc" value="${esc(l.descricao||"")}"></label>
  ${l.vendaId?`<p class="full t2" style="margin:0">Vinculado à venda: ${esc((S.ven.find(v=>v.id===l.vendaId)||{}).imovel||"venda")}</p>`:""}</form>${footBtns("lancamentos",id)}`);
  document.querySelectorAll("input[name=tipo]").forEach(r=>r.onchange=e=>{$("#fCat").innerHTML=catOpts(e.target.value)});
  bindSubmit(async()=>{const valor=parseMoney($("#fValor").value);if(valor<=0||!$("#fData").value){toast("Informe a data e o valor.");return false}
    return saveDoc("lancamentos",id,{tipo:document.querySelector("input[name=tipo]:checked").value,data:$("#fData").value,valor,categoria:$("#fCat").value,corretorId:$("#fCor").value||null,descricao:$("#fDesc").value.trim(),vendaId:l.vendaId||null})},id?"Lançamento atualizado":"Lançamento salvo")}

function openLead(id){if(!id&&!needCor())return;const l=id?S.lead.find(x=>x.id===id):{data:defDate(),quantidade:1,corretorId:meuCor()};
  openModal(`<h2>${id?"Editar lead":"Registrar leads"}</h2><form class="form" id="f">
  <label>Data<input type="date" id="fData" required value="${esc(l.data||"")}"></label><label>Quantidade<input type="number" min="1" step="1" id="fQtd" value="${+l.quantidade||1}"></label>
  <label>Corretor que recebeu<select id="fCor">${corOpts(l.corretorId)}</select></label><label>Origem<select id="fOrig">${origOpts(l.origem)}</select></label>
  <label class="full">Cliente (opcional)<input id="fCli" value="${esc(l.cliente||"")}"></label><label class="full">Observações<input id="fObs" value="${esc(l.obs||"")}"></label></form>${footBtns("leads",id)}`);
  bindSubmit(async()=>{if(!$("#fData").value){toast("Informe a data.");return false}return saveDoc("leads",id,{data:$("#fData").value,quantidade:Math.max(1,parseInt($("#fQtd").value)||1),corretorId:$("#fCor").value,origem:$("#fOrig").value,cliente:$("#fCli").value.trim(),obs:$("#fObs").value.trim()})},id?"Lead atualizado":"Leads registrados")}

function openAg(id){if(!id&&!needCor())return;const a=id?S.ag.find(x=>x.id===id):{data:defDate(),finalidade:"Venda",corretorId:meuCor()};
  openModal(`<h2>${id?"Editar agenciamento":"Novo agenciamento"}</h2><form class="form" id="f">
  <label>Data<input type="date" id="fData" required value="${esc(a.data||"")}"></label><label>Corretor que captou<select id="fCor">${corOpts(a.corretorId)}</select></label>
  <label class="full">Imóvel<input id="fImovel" placeholder="Endereço ou referência" value="${esc(a.imovel||"")}"></label>
  <label>Finalidade<select id="fFin">${["Venda","Locação","Venda e locação"].map(o=>`<option ${o===a.finalidade?"selected":""}>${o}</option>`).join("")}</select></label>
  <label>Valor anunciado (R$)<input id="fValor" inputmode="decimal" value="${moneyIn(a.valor)}"></label>
  <label class="full">Observações<input id="fObs" value="${esc(a.obs||"")}"></label></form>${footBtns("agenciamentos",id)}`);
  bindSubmit(async()=>{if(!$("#fData").value){toast("Informe a data.");return false}return saveDoc("agenciamentos",id,{data:$("#fData").value,corretorId:$("#fCor").value,imovel:$("#fImovel").value.trim(),finalidade:$("#fFin").value,valor:parseMoney($("#fValor").value)||null,obs:$("#fObs").value.trim()})},id?"Agenciamento atualizado":"Agenciamento registrado")}

let submitting=false;
function bindSubmit(fn,msg){const f=$("#f"),btn=$("#sheet button[type=submit]");
  const go=async e=>{e&&e.preventDefault();if(submitting)return;if(!f.reportValidity())return;submitting=true;btn.disabled=true;
    try{const ok=await fn();if(ok!==false){closeModal();toast(msg)}}finally{submitting=false;if(btn.isConnected)btn.disabled=false}};
  f.onsubmit=go;btn.onclick=go}

async function doDelete(btn){const col=btn.dataset.col,id=btn.dataset.id;
  if(!btn.classList.contains("armed")){
    if(col==="corretores"){const used=S.ven.some(v=>v.corretorId===id||v.agenciadorId===id)||S.lead.some(l=>l.corretorId===id)||S.ag.some(a=>a.corretorId===id);
      if(used){toast("Este corretor tem registros. Desmarque “Corretor ativo” para tirá-lo da equipe sem perder o histórico.");return}}
    btn.classList.add("armed");btn.textContent="Confirmar exclusão";setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent="Excluir"}},4000);return}
  btn.disabled=true;if(await delDoc(col,id)){closeModal();toast("Excluído")}else btn.disabled=false}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el){if(e.target.id==="modal")closeModal();return}
  const a=el.dataset.a,id=el.dataset.id;
  const map={"venda-nova":()=>openVenda(),"venda-edit":()=>openVenda(id),"receber":()=>openReceber(id),"repasse":()=>openRepasse(id),
    "cor-novo":()=>openCor(),"cor-edit":()=>openCor(id),"cor-ficha":()=>fichaCor(id),"lead-novo":()=>openLead(),"lead-edit":()=>openLead(id),
    "ag-novo":()=>openAg(),"ag-edit":()=>openAg(id),"lanc-novo":()=>openLanc(),"lanc-edit":()=>openLanc(id),
    "user-save":()=>saveUser(id),"user-ok":()=>saveUser(id,true),"user-block":()=>saveUser(id,false),
    "close":closeModal,"del":()=>doDelete(el),"ftipo":()=>{S.fLancTipo=id;render()}};
  if(map[a]){e.preventDefault();map[a]()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)closeModal();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".cor[data-a]")){e.preventDefault();fichaCor(e.target.dataset.id)}});
document.querySelectorAll("[data-esc]").forEach(b=>b.onclick=()=>{S.escopo=b.dataset.esc;store("ci_esc",S.escopo);render()});
$("#prev").onclick=()=>shift(-1);$("#next").onclick=()=>shift(1);
window.addEventListener("hashchange",()=>{if(S.recovery)return;S.cfgDirty=false;render()});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render())}catch(e){}

/* ---------- início ---------- */
async function boot(){
  const cfg=window.IMOB_CONFIG||{};
  if(!cfg.supabaseUrl||/COLE_AQUI/.test(cfg.supabaseUrl+cfg.supabaseAnonKey)){showSetup();return}
  if(!window.supabase){authScreen(`<h1>Sem conexão</h1><p class="lead">Não foi possível carregar o sistema. Verifique a internet e recarregue a página.</p>`);return}
  S.recovery=/type=recovery/.test(location.hash);
  S.sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  S.sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){S.recovery=true;S.ready=false;showNovaSenha()}});
  const{data:{session}}=await S.sb.auth.getSession();
  if(S.recovery&&session){showNovaSenha();return}
  if(session)await enter(session);else showLogin();
}
boot();
</script>
</body>
</html>
